services:


  db:
    build: ./mysql

    container_name: mysql-auth

    image: mysql-auth

    environment:
      MYSQL_ROOT_PASSWORD: mt;YN`sDP>>@km;x*Tfkm;x
      MYSQL_USER: supertokens_user
      MYSQL_PASSWORD: )4^zN-GZUNDAgpRjc3T]cf
      MYSQL_DATABASE: supertokens

    ports:
      - 9906:3306

    volumes: 
      - /persistence_supertoken:/var/lib/mysql

    networks:
      - app_network

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 60s
      retries: 10


  supertokens:
    build: ./supertoken/

    image: supertoken-core:9.2.3

    container_name: supertoken-core

    depends_on:
      db:
        condition: service_healthy

    ports:
      - 3567:3567

    environment:
      MYSQL_CONNECTION_URI: mysql://supertokens_user:)4%5EzN-GZUNDAgpRjc3T%5Dcf@db:3306/supertokens

    networks:
      - app_network

    restart: unless-stopped

    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 60s
      timeout: 5s
      retries: 10




networks:
  app_network:
    external: true